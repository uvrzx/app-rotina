<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROTINA 2026</title>
<meta name="description" content="Rotina pessoal, trabalho e jogos em um único dashboard.">
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROTINA">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell" id="app-shell">
  <button class="mobile-toggle" id="mobile-toggle" aria-label="Abrir menu"></button>
  <div class="sidebar-backdrop hidden" id="sidebar-backdrop"></div>

  <aside class="icon-rail" id="icon-rail">
    <div class="rail-logo"></div>
    <div class="rail-divider"></div>
    <nav class="rail-nav" id="rail-nav">
      <button class="rail-btn" data-view="hoje" title="Hoje"></button>
      <button class="rail-btn" data-view="rotina" title="Rotina"></button>
      <button class="rail-btn" data-view="trabalho" title="Trabalho"></button>
      <button class="rail-btn" data-view="pessoal" title="Pessoal"></button>
      <button class="rail-btn" data-view="jogos" title="Jogos"></button>
      <button class="rail-btn" data-view="quadro" title="Quadro Conjunto"></button>
    </nav>
    <span class="rail-brand-vertical">ROTINA 2026</span>
    <button class="rail-gear" id="btn-settings" title="Configurações"></button>
  </aside>

  <aside class="side-panel" id="side-panel">
    <div id="side-panel-body"></div>
  </aside>

  <main class="content-area">
    <section id="view-hoje" class="view"></section>
    <section id="view-rotina" class="view hidden"></section>
    <section id="view-trabalho" class="view hidden"></section>
    <section id="view-pessoal" class="view hidden"></section>
    <section id="view-jogos" class="view hidden"></section>
    <section id="view-quadro" class="view hidden"></section>
    <div class="foot-note">rotina 2026 · dados salvos apenas neste dispositivo (localStorage)</div>
  </main>

  <div class="modal-overlay hidden" id="settings-modal">
    <div class="modal-card">
      <button class="modal-close" id="settings-close">✕</button>
      <h3>Configurações</h3>
      <div class="modal-sub">notificações, instalação e preferências</div>
      <div id="settings-body"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
